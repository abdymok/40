name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
    inputs:
      skip_validation:
        description: 'Emergency only: bypass chronology validation for this deployment'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate chronology HTML
        if: ${{ inputs.skip_validation != true }}
        run: python3 scripts/check_chronology.py
      - name: Record emergency validation bypass
        if: ${{ inputs.skip_validation == true }}
        run: |
          echo 'WARNING: chronology validation was bypassed for this manual deployment.'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set page date from Kyiv calendar
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import re

          path = Path("articles/critical-infrastructure-damage.html")
          html = path.read_text(encoding="utf-8")
          today = datetime.now(ZoneInfo("Europe/Kyiv")).date()
          iso = today.isoformat()
          month = today.strftime("%b")
          label = f"{month}.&nbsp;{today.day}"
          title = f"Kyiv infrastructure chronology through {month}. {today.day}, {today.year}"

          html, title_count = re.subn(
              r"Kyiv infrastructure chronology through [^<\"]+",
              title,
              html,
          )
          if title_count < 4:
              raise SystemExit(f"Expected at least 4 page-title fields, updated {title_count}")

          html, date_count = re.subn(
              r'"dateModified"\s*:\s*"\d{4}-\d{2}-\d{2}"',
              f'"dateModified": "{iso}"',
              html,
              count=1,
          )
          if date_count != 1:
              raise SystemExit("Could not update JSON-LD dateModified")

          html, dek_count = re.subn(
              r"September 30–[A-Za-z]+&nbsp;\d{1,2}, \d{4}",
              f"September 30–{month}&nbsp;{today.day}, {today.year}",
              html,
              count=1,
          )
          if dek_count != 1:
              raise SystemExit("Could not update chronology date range")

          html, updated_count = re.subn(
              r"Updated <time datetime=\"[^\"]+\">.*?</time>",
              f"Updated <time datetime=\"{iso}\">{label}</time>",
              html,
              count=1,
          )
          if updated_count != 1:
              raise SystemExit("Could not update page update date")

          html, cutoff_count = re.subn(
              r"Chronology and reporting cutoff through <time datetime=\"[^\"]+\">.*?</time>",
              f"Chronology and reporting cutoff through <time datetime=\"{iso}\">{label}</time>",
              html,
              count=1,
          )
          if cutoff_count != 1:
              raise SystemExit("Could not update chronology cutoff")

          # The update paragraph is editorial copy, not a dated template.
          # Do not rewrite its incident summary or require obsolete wording here.

          path.write_text(html, encoding="utf-8")
          print(f"Page date set to {iso} ({ZoneInfo('Europe/Kyiv')})")
          print("Dashboard figures retain their own verified-through dates.")
          PY
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
