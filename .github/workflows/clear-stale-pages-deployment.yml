name: Clear stale GitHub Pages deployment

on:
  push:
    paths:
      - ".github/workflows/clear-stale-pages-deployment.yml"

permissions:
  deployments: write
  pages: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Retire the stale deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          deployment_id=7470420548
          gh api --method POST "repos/${REPOSITORY}/deployments/$deployment_id/statuses" -f state=failure -f description="Retiring stale GitHub Pages deployment record to release deployment lock"
          gh api --method DELETE "repos/${REPOSITORY}/deployments/$deployment_id"
          echo "Retired stale deployment $deployment_id"
