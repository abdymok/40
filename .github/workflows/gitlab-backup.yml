name: Back up to GitLab

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"

permissions:
  contents: read

concurrency:
  group: gitlab-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out all GitHub history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare GitHub and GitLab main before syncing
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/abdymok-group/40.git"
          git fetch gitlab '+refs/heads/*:refs/remotes/gitlab/*' --tags

          echo "GitHub main: $(git rev-parse origin/main)"
          echo "GitLab main: $(git rev-parse refs/remotes/gitlab/main)"
          echo "=== Commits only on GitHub ==="
          git log --oneline --decorate refs/remotes/gitlab/main..origin/main
          echo "=== Commits only on GitLab ==="
          git log --oneline --decorate origin/main..refs/remotes/gitlab/main
          echo "=== GitLab tip commit ==="
          git show -s --format=fuller refs/remotes/gitlab/main
          echo "=== GitLab-only commits and patch-equivalence ==="
          git cherry -v origin/main refs/remotes/gitlab/main
          echo "=== Actual tip-to-tip file differences ==="
          git diff --name-status origin/main refs/remotes/gitlab/main
          git diff --stat origin/main refs/remotes/gitlab/main
          if git diff --quiet origin/main refs/remotes/gitlab/main; then
            echo "The two branch trees are identical."
          else
            echo "The two branch trees differ; no merge or push attempted."
          fi
          echo "=== GitLab and GitHub archive commit parents ==="
          git show -s --format=fuller\nParents:%P refs/remotes/gitlab/main
          git show -s --format=fuller\nParents:%P d6a28d09e4850672d90334bd3a734f91622afda5
          echo "=== Difference between the two archive commits ==="
          git diff --stat d6a28d09e4850672d90334bd3a734f91622afda5 refs/remotes/gitlab/main -- articles/critical-infrastructure-archive.html articles/critical-infrastructure-damage.html
          git diff --unified=1 d6a28d09e4850672d90334bd3a734f91622afda5 refs/remotes/gitlab/main -- articles/critical-infrastructure-archive.html articles/critical-infrastructure-damage.html

          if git merge-base --is-ancestor refs/remotes/gitlab/main origin/main; then
            echo "GitLab main is an ancestor of GitHub main; a fast-forward mirror push is safe."
            git push gitlab 'refs/remotes/origin/*:refs/heads/*' --tags
          else
            git config user.name "abdymok"
            git config user.email "abdymok@gmail.com"
            echo "=== Dry-run merge of GitLab main into GitHub main ==="
            if git merge --no-commit --no-ff refs/remotes/gitlab/main; then
              echo "Merge is clean."
              echo "MERGE_TREE=$(git write-tree)"
              echo "=== Proposed merge result ==="
              git diff --cached --name-status
              git diff --cached --stat
              git merge --abort
            else
              echo "::warning::Merge has conflicts. No refs were changed."
              git status --short
              git merge --abort || true
            fi
          fi
