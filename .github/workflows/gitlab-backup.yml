name: Back up to GitLab

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"

permissions:
  contents: read

concurrency:
  group: gitlab-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out all GitHub history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare GitHub and GitLab main before syncing
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/abdymok-group/40.git"
          git fetch gitlab '+refs/heads/*:refs/remotes/gitlab/*' --tags

          echo "GitHub main: $(git rev-parse origin/main)"
          echo "GitLab main: $(git rev-parse refs/remotes/gitlab/main)"
          echo "=== Commits only on GitHub ==="
          git log --oneline --decorate refs/remotes/gitlab/main..origin/main
          echo "=== Commits only on GitLab ==="
          git log --oneline --decorate origin/main..refs/remotes/gitlab/main
          echo "=== GitLab-only change summary ==="
          git diff --stat origin/main...refs/remotes/gitlab/main || true

          if git merge-base --is-ancestor refs/remotes/gitlab/main origin/main; then
            echo "GitLab main is an ancestor of GitHub main; a fast-forward mirror push is safe."
            git push gitlab 'refs/remotes/origin/*:refs/heads/*' --tags
          else
            echo "::warning::GitLab main contains commits not present on GitHub. No refs were changed. Review the divergence before merging."
          fi
