name: Back up to GitLab

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"

permissions:
  contents: read

# Serialize mirror pushes and never rewrite a remote branch.
concurrency:
  group: gitlab-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out all GitHub history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ancestry and push branches and tags
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/abdymok-group/40.git"
          git fetch gitlab '+refs/heads/*:refs/remotes/gitlab/*' --tags

          if ! git merge-base --is-ancestor refs/remotes/gitlab/main origin/main; then
            echo "::error::GitLab main is not an ancestor of GitHub main. No refs were changed."
            exit 1
          fi

          git push gitlab 'refs/remotes/origin/*:refs/heads/*' --tags
