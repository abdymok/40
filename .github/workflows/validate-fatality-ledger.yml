name: Validate fatality ledger

on:
  push:
    branches:
      - main
    paths:
      - 'fatality-ledger/**'
      - 'scripts/validate_fatality_ledger.py'
      - '.github/workflows/validate-fatality-ledger.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'fatality-ledger/**'
      - 'scripts/validate_fatality_ledger.py'
      - '.github/workflows/validate-fatality-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fatality-ledger-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate ledger and revision history
        run: python scripts/validate_fatality_ledger.py
