<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{display:block}
video{display:block;width:100vw;height:100vh;object-fit:cover;background:#000}

<body>
<video autoplay muted loop playsinline preload="auto">
  <source src="./running.mp4" type="video/mp4">
</video>
<script>
const v = document.querySelector('video');
const portrait = window.matchMedia('(orientation: portrait)');
let startAt = 0;
let retryQueued = false;
let seekPending = false;

// Set both the HTML attributes and runtime properties for iOS Safari.
v.muted = true;
v.defaultMuted = true;
v.playsInline = true;
v.setAttribute('muted', '');
v.setAttribute('playsinline', '');
v.setAttribute('webkit-playsinline', '');
v.controls = false;

function configurePlayback() {
  if (!Number.isFinite(v.duration) || !v.duration) return;
  const target = portrait.matches ? v.duration * 0.8 : 0;
  startAt = target;
  v.loop = !portrait.matches;

  // On iOS, wait for the seek to finish before asking playback to begin.
  if (Math.abs(v.currentTime - target) > 1.5) {
    seekPending = true;
    v.addEventListener('seeked', () => {
      seekPending = false;
      attemptPlay();
    }, { once: true });
    v.currentTime = target;
  } else {
    attemptPlay();
  }
}

function attemptPlay() {
  v.muted = true;
  const result = v.play();
  if (result && typeof result.then === 'function') {
    result.then(() => {
      v.controls = false;
      retryQueued = false;
    }).catch(() => {
      // Never show controls or a custom tap overlay. Retry silently.
      v.controls = false;
      if (!retryQueued) {
        retryQueued = true;
        window.setTimeout(() => {
          retryQueued = false;
          if (document.visibilityState === 'visible' && v.paused && !seekPending) attemptPlay();
        }, 700);
      }
    });
  }
}

v.addEventListener('loadedmetadata', configurePlayback);
v.addEventListener('canplay', () => { if (!seekPending && !v.currentTime) attemptPlay(); });
v.addEventListener('playing', () => { v.controls = false; });
v.addEventListener('ended', () => {
  if (portrait.matches) {
    seekPending = true;
    v.addEventListener('seeked', () => {
      seekPending = false;
      attemptPlay();
    }, { once: true });
    v.currentTime = startAt;
  }
});
portrait.addEventListener?.('change', configurePlayback);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && v.paused) attemptPlay();
});
window.addEventListener('pageshow', () => {
  if (v.paused) attemptPlay();
});
v.controls = false;
</script>
</body>
