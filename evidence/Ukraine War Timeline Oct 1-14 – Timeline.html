document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 400;\n  font-display: swap;\n  src: url(\"6b68fb0b-c4c8-4ce3-b98b-56ef58ad4894\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/newsreader/v26/cY9qfjOCX1hbuyalUrK49dLac06G1ZGsZBtoBCzBDXXD9JVF438weI_wBOZFDjA.woff2) format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/newsreader/v26/cY9qfjOCX1hbuyalUrK49dLac06G1ZGsZBtoBCzBDXXD9JVF438weI_wBeZFDjA.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"9279f512-9ea9-4670-acba-85f9dd37a8af\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#fff;color:#000}\n*{box-sizing:border-box}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"background: #fff; color: #000; font-family: 'IBM Plex Sans', Helvetica, Arial, sans-serif\" data-canvas-width=\"960\" data-canvas-height=\"2900\" data-document-role=\"page\" data-label=\"Timeline\">\n<div style=\"max-width: 880px; margin: 0 auto; padding: 64px 24px 72px\">\n\n<header style=\"border-bottom: 3px solid #000; padding-bottom: 28px; margin-bottom: 44px\">\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px\">Russia-Ukraine war<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 56px; line-height: 1.05; letter-spacing: -0.01em\">Timeline, October 1–14, 2026<\u002Fh1>\n<p style=\"margin: 16px 0 0; font-size: 16px; line-height: 1.5\">Key events drawn from the Kyiv chronology, compiled October 15, 2026.<\u002Fp>\n<\u002Fheader>\n\n<article style=\"display: flex; flex-wrap: wrap\">\n<div style=\"flex: 0 0 160px; position: relative; padding-right: 40px; border-right: 1px solid #000\">\n<div style=\"position: absolute; right: -5px; top: 6px; width: 9px; height: 9px; background: #000\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase\">Oct 1–2<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px\">Thu–Fri<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 320px; min-width: 0; padding: 0 0 44px 40px\">\n<span style=\"display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid #000; padding: 2px 6px\">Strike<\u002Fspan>\n<h2 style=\"margin: 12px 0 10px; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Russian drones hit Kyiv's South Bridge 4 times in 2 days<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; max-width: 62ch\">Three hits come on Oct 1 and a fourth at about 5 a.m. on Oct 2, according to Mayor Vitali Klitschko. Kyiv's military administration later reports the bridge fully closed to traffic in both directions.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap\">\n<div style=\"flex: 0 0 160px; position: relative; padding-right: 40px; border-right: 1px solid #000\">\n<div style=\"position: absolute; right: -5px; top: 6px; width: 9px; height: 9px; background: #000\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase\">Oct 3–5<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px\">Sat–Mon<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 320px; min-width: 0; padding: 0 0 44px 40px\">\n<span style=\"display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid #000; padding: 2px 6px\">Strike<\u002Fspan>\n<h2 style=\"margin: 12px 0 10px; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Russia hits Kyiv's North Bridge on 2 consecutive days<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; max-width: 62ch\">A drone strikes the bridge at about 6:57 a.m. on Oct 3, damaging the road surface and trolleybus wires. It hits again on the morning of Oct 4, injuring two people, and a heating main in Desniansky district is damaged the same day. Z says more than 12 automated .50-caliber anti-drone turrets are installed in Kyiv. On Oct 5 an Air Force spokesman says turrets on the bridges have already intercepted jet-powered drones.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap\">\n<div style=\"flex: 0 0 160px; position: relative; padding-right: 40px; border-right: 1px solid #000\">\n<div style=\"position: absolute; right: -5px; top: 6px; width: 9px; height: 9px; background: #000\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase\">Oct 7<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px\">Wed<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 320px; min-width: 0; padding: 0 0 44px 40px\">\n<span style=\"display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid #000; padding: 2px 6px\">Strike<\u002Fspan>\n<h2 style=\"margin: 12px 0 10px; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Russian missile strike on Pryluky kills at least 22 in a mass attack<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; max-width: 62ch\">A missile destroys part of a five-storey residential building in Pryluky, Chernihiv region. Police report 22 dead, including five children, and 54 injured, with rescue work continuing. The same attack hits four Kyiv districts, where at least two people die in Darnytsky district according to Klitschko, and energy enterprises in Kremenchuk. Emergency power cuts follow in Kyiv and Kyiv region.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap\">\n<div style=\"flex: 0 0 160px; position: relative; padding-right: 40px; border-right: 1px solid #000\">\n<div style=\"position: absolute; right: -5px; top: 6px; width: 9px; height: 9px; background: #000\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase\">Oct 8<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px\">Thu<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 320px; min-width: 0; padding: 0 0 44px 40px\">\n<span style=\"display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid #000; padding: 2px 6px\">Strike<\u002Fspan>\n<h2 style=\"margin: 12px 0 10px; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Russian strike on 2 buses in Kramatorsk kills 33<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; max-width: 62ch\">At about 10:00 Kyiv time a strike hits a street where two scheduled passenger buses are travelling. The State Emergency Service reports 33 killed and 18 wounded. Donetsk regional head Vadym Filashkin orders public transport suspended in Kramatorsk and Sloviansk.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap\">\n<div style=\"flex: 0 0 160px; position: relative; padding-right: 40px; border-right: 1px solid #000\">\n<div style=\"position: absolute; right: -9px; top: 3px; width: 17px; height: 17px; background: #000\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase\">Oct 9<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px\">Fri<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 320px; min-width: 0; padding: 0 0 44px 40px\">\n<div style=\"background: #000; color: #fff; padding: 28px 32px 30px\">\n<span style=\"display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid #fff; padding: 2px 6px\">Announced by Trump<\u002Fspan>\n<h2 style=\"margin: 14px 0 14px; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.15\">Trump says Putin agreed to supply diesel to lower fuel prices<\u002Fh2>\n<div>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase\">Oct. 9 · approx. 5:04 p.m. EDT (Oct. 10 in Kyiv)<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px\">White House South Lawn, Washington<\u002Fdiv>\n<p style=\"margin: 14px 0 12px; font-size: 16px; line-height: 1.55; max-width: 62ch\"><a href=\"https://www.whitehouse.gov/videos/president-trump-gaggles-with-press-upon-departure-from-the-white-house-oct-9-2026/\" style=\"color: #fff; text-decoration: underline\">Watch the White House press spray<\u002Fa>. Former heavyweight boxing champion Mike Tyson stands beside President Donald Trump.<\u002Fp>\n<p style=\"margin: 0 0 12px; font-size: 16px; line-height: 1.55; max-width: 62ch\">Without being asked about diesel, Trump volunteered an announcement thanking Russian President Vladimir Putin for agreeing to supply diesel to the American and global markets. An unidentified woman reporter immediately put the Ukrainian president’s criticism to him.<\u002Fp>\n<p style=\"margin: 0 0 12px; font-family: 'Newsreader', Georgia, serif; font-size: 20px; line-height: 1.4; max-width: 56ch\">“[Z] said you’re weak because of it. He just criticized you.”<\u002Fp>\n<p style=\"margin: 0 0 12px; font-size: 16px; line-height: 1.55; max-width: 62ch\">Trump’s response: “Who said that?”<\u002Fp>\n<p style=\"margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 20px; line-height: 1.4; max-width: 56ch\">“[Z], Ukrainian president, just said you’re weak because of the deal.”<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap\">\n<div style=\"flex: 0 0 160px; position: relative; padding-right: 40px; border-right: 1px solid #000\">\n<div style=\"position: absolute; right: -5px; top: 6px; width: 9px; height: 9px; background: #000\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase\">Oct 9<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px\">Fri<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 320px; min-width: 0; padding: 0 0 44px 40px\">\n<span style=\"display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid #000; padding: 2px 6px\">Reaction<\u002Fspan>\n<h2 style=\"margin: 12px 0 10px; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Z says easing Russian diesel sanctions is 'an obvious weakness'<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; max-width: 62ch\">He says the deal gives Putin more money to continue the war and that any easing of energy sanctions should be tied to an agreement to stop attacks on energy infrastructure. At the White House that afternoon (already Oct 10 in Kyiv) a reporter puts the criticism to Trump, who replies \"We are a strong partner\" and says \"we need oil for the world.\"<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap\">\n<div style=\"flex: 0 0 160px; position: relative; padding-right: 40px; border-right: 1px solid #000\">\n<div style=\"position: absolute; right: -5px; top: 6px; width: 9px; height: 9px; background: #000\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase\">Oct 10<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px\">Sat<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 320px; min-width: 0; padding: 0 0 44px 40px\">\n<span style=\"display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid #000; padding: 2px 6px\">Strike<\u002Fspan>\n<h2 style=\"margin: 12px 0 10px; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Russian guided bombs kill at least 20 in Zaporizhia<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; max-width: 62ch\">Bombs hit a residential neighborhood. The Kyiv Independent, citing regional authorities, reports 20 dead, including three children. Ukrinform reports 32 injured, including three children. Rescue work continues and the figures may change.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap\">\n<div style=\"flex: 0 0 160px; position: relative; padding-right: 40px; border-right: 1px solid #000\">\n<div style=\"position: absolute; right: -5px; top: 6px; width: 9px; height: 9px; background: #000\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase\">Oct 11–12<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px\">Sun–Mon<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 320px; min-width: 0; padding: 0 0 44px 40px\">\n<span style=\"display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid #000; padding: 2px 6px\">Announced by Trump<\u002Fspan>\n<h2 style=\"margin: 12px 0 10px; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Trump announces an 'energy ceasefire' and says both sides agreed<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; max-width: 62ch\">Trump declares the ceasefire effective immediately. Z tells Axios the announcement is news to him and that Ukraine will agree if Russia does. On Oct 12, asked why Russia and Ukraine deny agreeing, Trump answers \"Because I said they agreed.\" Contemporaneous reporting does not confirm a bilateral agreement.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap\">\n<div style=\"flex: 0 0 160px; position: relative; padding-right: 40px; border-right: 1px solid #000\">\n<div style=\"position: absolute; right: -5px; top: 6px; width: 9px; height: 9px; background: #000\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase\">Oct 12–13<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px\">Mon–Tue<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 320px; min-width: 0; padding: 0 0 44px 40px\">\n<span style=\"display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid #000; padding: 2px 6px\">Diplomacy<\u002Fspan>\n<h2 style=\"margin: 12px 0 10px; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Kremlin rejects Z's 60-day ceasefire and offers an election-day pause<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; max-width: 62ch\">Spokesman Dmitry Peskov says Putin would be prepared to order Russian forces not to attack on election day itself, and rejects the 60-day ceasefire Z proposed to organize elections. Foreign Minister Sergei Lavrov says he does not think Z has \"deserved\" a ceasefire and that Russia's war aims are unchanged. On Oct 13 the Kremlin says contacts on an energy ceasefire continue without confirming agreement. Reuters reports no direct hits on energy targets in the overnight attack into Oct 13, the first such night since Trump's announcement, but says it is unclear whether that was deliberate.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap\">\n<div style=\"flex: 0 0 160px; position: relative; padding-right: 40px; border-right: 1px solid #000\">\n<div style=\"position: absolute; right: -5px; top: 6px; width: 9px; height: 9px; background: #000\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase\">Oct 12–13<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px\">Mon–Tue<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 320px; min-width: 0; padding: 0 0 44px 40px\">\n<span style=\"display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid #000; padding: 2px 6px\">Reported<\u002Fspan>\n<h2 style=\"margin: 12px 0 10px; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Z says partners gave no warning before ballistic strike on Kyiv<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; max-width: 62ch\">Explosions sound at about 22:10 on Oct 12, before the air-raid sirens. The Air Force says radar detected about six ballistic missiles but it had no launch information. On Oct 13 Z says Ukraine received no warning from partners, without naming any. CNN had reported that Washington threatened to suspend intelligence sharing and European purchases of US weapons if Kyiv keeps striking Russian energy sites. That link is not established, and Foreign Minister Andriy Sybiha says intelligence cooperation with the US continues.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap\">\n<div style=\"flex: 0 0 160px; position: relative; padding-right: 40px; border-right: 1px solid #000\">\n<div style=\"position: absolute; right: -5px; top: 6px; width: 9px; height: 9px; background: #000\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase\">Oct 13–14<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px\">Tue–Wed<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 320px; min-width: 0; padding: 0 0 44px 40px\">\n<span style=\"display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid #000; padding: 2px 6px\">Strike<\u002Fspan>\n<h2 style=\"margin: 12px 0 10px; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Russia hits Ukraine's energy system with 39 missiles and 128 drones<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; max-width: 62ch\">The Air Force counts the attack from 18:00 on Oct 13. Z says at least 600,000 people lose power and damage hits 26 elements of the electricity system and four oil-and-gas facilities. He says the strike comes despite the ceasefire Trump announced and asks for stronger sanctions and more Patriot missiles. Naftogaz chief Serhiy Koretsky says all three Kyiv combined heat and power plants are attacked, without specifying the damage. Kyiv reports at least five killed and more than 30 injured, and Lutsk reports six killed. Ukrenergo says a drone severed a Dnipro power-line tower in Kyiv that cannot be restored. Death tolls are provisional.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article style=\"display: flex; flex-wrap: wrap\">\n<div style=\"flex: 0 0 160px; position: relative; padding-right: 40px; border-right: 1px solid #000\">\n<div style=\"position: absolute; right: -5px; top: 6px; width: 9px; height: 9px; background: #000\"><\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase\">Oct 14<\u002Fdiv>\n<div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px\">Wed<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 999 1 320px; min-width: 0; padding: 0 0 12px 40px\">\n<span style=\"display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid #000; padding: 2px 6px\">Reported<\u002Fspan>\n<h2 style=\"margin: 12px 0 10px; font-family: 'Newsreader', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.2\">Z adviser says SpaceX caps StarShield terminals at 100 mph<\u002Fh2>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.55; max-width: 62ch\">Serhii Beskrestnov, an adviser to Z on defense technology, says the limit appears overnight with no warning and disrupts several missions. Ukrainska Pravda cites four front-line military sources who confirm restrictions, and Reuters cites a source in the 7th Rapid Reaction Corps who confirms disruption. Beskrestnov links the timing to the political situation. The reports do not establish why the limit is introduced.<\u002Fp>\n<\u002Fdiv>\n<\u002Farticle>\n\n<footer style=\"border-top: 3px solid #000; margin-top: 40px; padding-top: 20px\">\n<p style=\"margin: 0 0 10px; font-size: 14px; line-height: 1.55; max-width: 66ch\">Current to Oct 14. Casualty figures are provisional and as reported by the officials named. 'Reported' marks an attributed account that the cited reporting does not independently verify in full.<\u002Fp>\n<p style=\"margin: 0 0 6px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.6\">Credits: <a href=\"https://abdymok.github.io\" style=\"color: #000; text-decoration: underline\">abd<span style=\"color: #d00000\">y<\u002Fspan>mok<\u002Fa><\u002Fp>\n<p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.6\">Sources: the compiler's Kyiv chronology, citing Interfax-Ukraine, Ukrainska Pravda, Ukrinform, The Kyiv Independent, Reuters, CNN, Axios, Suspilne and Ukrainian officials<\u002Fp>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:960,&quot;height&quot;:2900}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
