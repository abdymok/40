<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dnipro</title><style>
html,body{margin:0;background:#111;color:#eee;font-family:Georgia,serif}body{min-height:100vh}.frame{height:100vh;position:relative;overflow:hidden}.photo{position:absolute;inset:0;background:url('./dnipro.jpg') center/cover no-repeat;transform:scale(1.015);transition:transform 12s ease}.frame:hover .photo{transform:scale(1.035)}.veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.08),rgba(0,0,0,.16) 55%,rgba(0,0,0,.42))}
.verse{position:absolute;font-size:15px;line-height:1.5;letter-spacing:.02em;text-shadow:0 1px 12px rgba(0,0,0,.9);pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity 1.5s ease,transform 1.5s ease}.verse.active{opacity:.72;transform:translateY(0);animation:float 4s ease-in-out infinite}.verse.final{opacity:0;transform:translateY(10px);transition:opacity 2s ease,transform 2s ease}.verse.final.active{opacity:.72;transform:translateY(0);animation:float 4s ease-in-out infinite}
.v1{left:8vw;top:20vh}.v2{right:9vw;top:31vh}.v3{left:18vw;top:58vh}.v4{right:20vw;top:59vh}.v5{left:42vw;top:39vh;text-align:center}@keyframes float{0%,100%{transform:translate(-6px,3px) rotate(-.4deg)}50%{transform:translate(7px,-6px) rotate(.4deg)}}.sound{position:absolute;right:5vw;top:5vh;border:0;background:rgba(0,0,0,.18);color:#fff;padding:7px 9px;font:12px Georgia,serif;letter-spacing:.08em;cursor:pointer;opacity:.7}.caption{position:absolute;left:5vw;bottom:5vh;font-size:14px;letter-spacing:.08em}.caption span{display:block;margin-top:9px;font-size:12px;letter-spacing:.03em;opacity:.72}.enter{position:absolute;right:5vw;bottom:5vh;color:#fff;text-decoration:none;font-size:12px;letter-spacing:.08em;opacity:.72}@media(max-width:700px){.verse{font-size:12px;max-width:210px}.v1{left:6vw}.v2{right:6vw}.v3{left:9vw}.v4{right:8vw}.v5{left:50%;transform:translateX(-50%)}}</style></head><body><main class="frame"><div class="photo"></div><div class="veil"></div>
<div class="verse v1">The war continues<br>its terrible experiment.</div>
<div class="verse v2">Our small duty<br>is not to explain everything.</div>
<div class="verse v3">It is to remain capable<br>of being surprised.</div>
<div class="verse v4">And when the world contradicts us,</div>
<div class="verse v5 final">to listen.</div>
<button class="sound" id="sound">sound</button><audio id="audio" preload="metadata"><source src="./dnipromp3.mp3" type="audio/mpeg"></audio><div class="caption">dnipro<span>Somewhere behind the mist is the city.</span></div><a class="enter" href="../">enter the archive →</a></main><script>
const a=document.getElementById('audio'),s=document.getElementById('sound'),verses=[...document.querySelectorAll('.verse:not(.final)')],final=document.querySelector('.final');
s.onclick=()=>{if(a.paused){a.play().then(()=>s.textContent='sound on').catch(()=>{});}else{a.pause();s.textContent='sound'}};a.onended=()=>s.textContent='sound';
window.onload=()=>{document.querySelector('.photo').style.transform='scale(1.035)';let i=0;function show(){if(i>0)verses[i-1].classList.remove('active');if(i<verses.length){verses[i].classList.add('active');i++;setTimeout(show,5200)}else{final.classList.add('active')}}show()};
</script></body></html>
