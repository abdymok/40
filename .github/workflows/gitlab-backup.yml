name: Back up to GitLab

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * *"

permissions:
  contents: read

# Only one mirror push may run at a time. Concurrent pushes can race while
# GitLab updates refs, causing "incorrect old value provided" rejections.
concurrency:
  group: gitlab-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out all GitHub history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/abdymok-group/40.git"

          # Retry transient GitLab-side storage and ref-lock errors.
          for attempt in 1 2 3; do
            if git push gitlab 'refs/remotes/origin/*:refs/heads/*' --tags; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "GitLab push failed (attempt $attempt/3); retrying..."
              sleep $((attempt * 10))
            fi
          done

          echo "GitLab push failed after 3 attempts."
          exit 1
