<script>
const slides=[{"id": 1, "year": 2022, "image": "images/1.jpg", "back": "Delivers an unpanicked, sober reading of invasion signals on the very first morning of the <a href=\"https://abdymok.substack.com/p/russias-further-invasion-day-1\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"1\">full-scale war<\/a>, cutting through media buzzwords."}, {"id": 2, "year": 2021, "image": "images/2.jpg", "back": "Warned as early as <a href=\"https://abdymok.substack.com/p/banal-murder-plot?utm_source=publication-search\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"2\">January 2021<\/a> that a security service consumed by internal power struggles and contraband revenue cannot simultaneously execute complex counterintelligence operations against foreign threats."}, {"id": 3, "year": 2021, "image": "images/3.jpg", "back": "Chronicles &quot;<a href=\"https://abdymok.substack.com/p/coming-to-a-theater-near-you?utm_source=publication-search\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"3\">Wagnergate<\/a>&quot; (Operation Avenue), exposing systemic institutional leaks and official dishonesty at the highest levels of executive leadership prior to the invasion."}, {"id": 4, "year": 2020, "image": "images/4.jpg", "back": "Exposes <a href=\"https://abdymok.substack.com/p/ukraines-plan-\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"4\">parliamentary cover-ups<\/a> and sanitizing investigations designed to shield executive figures from accountability over compromised intelligence operations."}, {"id": 5, "year": 2021, "image": "images/5.jpg", "back": "Uses <a href=\"https://abdymok.substack.com/p/zelenskys-new-clothes\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"5\">game theory<\/a> (mutual vs. common knowledge) to demonstrate how performative political theater obscured pre-war governance defects."}, {"id": 6, "year": 2022, "image": "images/6.jpg", "back": "<a href=\"https://abdymok.substack.com/p/this-is-still-ukrainewar?utm_source=publication-search\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"6\">Morale is high, at least in Kyiv, with private military contractors and arms suppliers in abundance. Many of them are waiting anxiously for Tootsie Club to re-open.<\/a>"}, {"id": 7, "year": 2022, "image": "images/7.jpg", "back": "Accurately discerning the <a href=\"https://abdymok.substack.com/p/day-25-phase-3?utm_source=publication-search\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"7\">mental amplitudes<\/a> of Ukraine’s leaders is another key assessment that should be made. No one should pretend functioning democratic institutions exist."}, {"id": 8, "year": 2022, "image": "images/8.jpg", "back": "Critiques accredited Western experts and &quot;<a href=\"https://abdymok.substack.com/p/ignore-analysts\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"8\">bounded rationality<\/a>&quot; models that failed to anticipate Russian strategic choices."}, {"id": 9, "year": 2022, "image": "images/9.jpg", "back": "I much prefer spherical cows, factoring agreements and thinking about the <a href=\"https://abdymok.substack.com/p/day-22-phase-3?utm_source=publication-search\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"9\">El Farol Bar problem<\/a> than browsing battlefield posts on Telegram channels. Future projects abound, including goats, chickens, livestock guardian dogs."}, {"id": 10, "year": 2023, "image": "images/10.jpg", "back": "Lifts the curtain on war-adjacent commentary and opportunistic media narratives that obscure core <a href=\"https://abdymok.substack.com/p/this-is-still-ukrainewar?utm_source=publication-search\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"10\">operational realities<\/a>."}, {"id": 11, "year": 2023, "image": "images/11.jpg", "back": "Enumerates the three fundamental operational requirements (<a href=\"https://abdymok.substack.com/p/day-499\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"11\">closing the sky<\/a>, activating additional corps, and securing long-range precision strike capabilities) needed to break positional stalemate."}, {"id": 12, "year": 2023, "image": "images/12.jpg", "back": "Deconstructs early <a href=\"https://abdymok.substack.com/p/day-516\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"12\">counteroffensive hype<\/a> versus the unglamorous tactical realities on the ground."}, {"id": 13, "year": 2022, "image": "images/13.jpg", "back": "<a href=\"https://abdymok.substack.com/p/pause-operationnelle?utm_source=publication-search\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"13\">The Club for Aesthetic Disobedience, which for years has criticized “beautification projects” in the capital, describes our architectural jungle the best: a poorly lit dog’s breakfast.<\/a>"}, {"id": 14, "year": 2024, "image": "images/14.jpg", "back": "Critiques the lack of long-term <a href=\"https://abdymok.substack.com/p/day-730\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"14\">strategic coherence<\/a> as the full-scale conflict entered its second year."}, {"id": 15, "year": 2024, "image": "images/15.jpg", "back": "Accurately analyzes the operational dimensions of <a href=\"https://abdymok.substack.com/p/day-748\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"15\">positional warfare<\/a> in transparent, drone-saturated battlefields."}, {"id": 16, "year": 2024, "image": "images/16.jpg", "back": "Exposes early <a href=\"https://abdymok.substack.com/p/day-1044\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"16\">command-and-control failures<\/a> in newly formed formations such as the 155th Brigade."}, {"id": 17, "year": 2024, "image": "images/17.jpg", "back": "Identifies <a href=\"https://abdymok.substack.com/p/day-1049\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"17\">four systemic failures<\/a>—unbuilt fortifications, forced conscription defects, new brigade failures, and domestic production breakdowns—long before official acknowledgment."}, {"id": 18, "year": 2025, "image": "images/18.jpg", "back": "Analyzes the &quot;<a href=\"https://abdymok.substack.com/p/day-1402\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"18\">negotiation gap<\/a>,&quot; proving the logical incompatibility between Russian objectives and Ukrainian state survival."}, {"id": 19, "year": 2026, "image": "images/19.jpg", "back": "Applies the biological concept of &quot;<a href=\"https://abdymok.substack.com/p/day-1454\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"19\">parabiosis<\/a>&quot; to critique aging, stagnant diplomatic frameworks and political exhaustion."}, {"id": 20, "year": 2026, "image": "images/20.jpg", "back": "Decouples <a href=\"https://abdymok.substack.com/p/day-1524\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"20\">military resilience<\/a> from liberal democracy, arguing that societal heroism on the battlefield does not automatically equate to sound institutional governance."}, {"id": 21, "year": 2026, "image": "images/21.jpg", "back": "Provides a <a href=\"https://abdymok.substack.com/p/day-1577\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"21\">multi-year retrospective<\/a> detailing how the archive&#x27;s analytical models evolved and held up across milestones."}, {"id": 22, "year": 2020, "image": "images/22.jpg", "back": "Establishes the foundational critique of Ukraine as a primitive post-Soviet <a href=\"https://abdymok.substack.com/p/thug-life\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"22\">feudal patronage system<\/a> rather than a fully functioning institutional democracy."}, {"id": 23, "year": 2020, "image": "images/23.jpg", "back": "Demonstrates how European institutions repeatedly collided with informal <a href=\"https://abdymok.substack.com/p/thug-life-contd?s=w\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"23\">patronage networks<\/a> and political theatrics in Kyiv."}, {"id": 24, "year": 2021, "image": "images/24.jpg", "back": "Critiques patronage figures (e.g., Mykola Tyshchenko) as symbols of <a href=\"https://abdymok.substack.com/p/a-man-in-full\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"24\">institutional decay<\/a>."}, {"id": 25, "year": 2022, "image": "images/25.jpg", "back": "Maps ultra-competitive, informal <a href=\"https://abdymok.substack.com/p/thug-life-contd-315\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"25\">political rivalries<\/a> operating behind formal state structures."}, {"id": 26, "year": 2020, "image": "images/26.jpg", "back": "Analyzes early cabinet reshuffles (e.g., Honcharuk&#x27;s sacking) to distinguish between macroeconomic illiteracy and <a href=\"https://abdymok.substack.com/p/operation-y-b2d557374ca7\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"26\">political sabotage<\/a>."}, {"id": 27, "year": 2021, "image": "images/27.jpg", "back": "Maps internal fallout and paranoia within <a href=\"https://abdymok.substack.com/p/drones-in-my-bones\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"27\">intelligence services<\/a> following Wagnergate and associated leaks."}, {"id": 28, "year": 2021, "image": "images/28.jpg", "back": "Analyzes the corporate and tactical evolution of <a href=\"https://abdymok.substack.com/p/scale-free-wagner-pmc\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"28\">mercenary networks<\/a> prior to their full-scale deployment."}, {"id": 29, "year": 2021, "image": "images/29.jpg", "back": "Examines how a background in <a href=\"https://abdymok.substack.com/p/i-an-actor\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"29\">performance art<\/a> shaped executive decision-making and public narrative management during national crises."}, {"id": 30, "year": 2020, "image": "images/30.jpg", "back": "Confronts official government statements downplaying explicit <a href=\"https://abdymok.substack.com/p/pants-on-fire\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"30\">invasion warnings<\/a>."}, {"id": 31, "year": 2025, "image": "images/31.jpg", "back": "Documents the <a href=\"https://abdymok.substack.com/p/day-1246\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"31\">legislative rollback<\/a> of anti-corruption agency oversight and the immediate domestic political backlash."}, {"id": 32, "year": 2026, "image": "images/32.jpg", "back": "Analyzes &quot;conversations that don&#x27;t happen,&quot; showing how analysts avoid naming <a href=\"https://abdymok.substack.com/p/day-1520\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"32\">structural patterns<\/a> when doing so threatens prior narratives."}, {"id": 33, "year": 2026, "image": "images/33.jpg", "back": "Parses wiretaps to explain how <a href=\"https://abdymok.substack.com/p/day-1525\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"33\">informal authority<\/a> and backroom procurement flows operate under wartime conditions."}, {"id": 34, "year": 2026, "image": "images/34.jpg", "back": "Exposes the &quot;<a href=\"https://abdymok.substack.com/p/day-1526\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"34\">Dynasty<\/a>&quot; luxury estate cooperative constructed for political insiders during the height of the conflict."}, {"id": 35, "year": 2021, "image": "images/35.jpg", "back": "Applies the &quot;<a href=\"https://abdymok.substack.com/p/ukraine-goes-coup-coup\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"35\">trolley car problem<\/a>&quot; to illustrate how executive impulse control creates broad systemic instability."}, {"id": 36, "year": 2024, "image": "images/36.jpg", "back": "Critiques opportunistic religious and <a href=\"https://abdymok.substack.com/p/day-1024\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"36\">ideological pivots<\/a> by political actors as winter conditions intensified."}, {"id": 37, "year": 2026, "image": "images/37.jpg", "back": "Connects early <a href=\"https://abdymok.substack.com/p/day-1408\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"37\">Wagnergate cover-ups<\/a> to subsequent structural consolidations inside the President&#x27;s Office."}, {"id": 38, "year": 2022, "image": "images/38.jpg", "back": "Maps the pre-war linguistic and conceptual confusion between &quot;imminent&quot; and &quot;<a href=\"https://abdymok.substack.com/p/lost-in-translation\" target=\"_blank\" rel=\"noopener noreferrer\" data-slide=\"38\">inevitable<\/a>&quot; invasion warnings."}, {"id": 39, "year": "", "image": "images/39.jpg", "back": "Thank you for looking.<br><br>The archive continues."}, {"id": 40, "year": "", "image": "images/40.jpg", "back": "Until the next recomposition."}];
const wall=document.getElementById('wall');
const tiles=slides.map(s=>{
 const el=document.createElement('article'); el.className='tile'; el.dataset.id=s.id; el.dataset.empty=(!s.back?'true':'false');
 el.innerHTML=`<div class="tile-inner"><div class="face front"><img src="${s.image}" alt="Mural image ${s.id}"></div><div class="face back"><span class="post-year">${s.year || ""}</span><div class="copy">${s.back}</div><button class="image-back" type="button" aria-label="Return to image">← image</button></div></div>`;
 if(!s.back) { el.dataset.empty='true'; el.querySelector('.front img').removeAttribute('src'); } el.tabIndex=0;
